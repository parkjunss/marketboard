name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 연속 push가 들어오면 이전 CI/CD는 취소
concurrency:
  group: marketboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 1. Backend Test
  # =========================================================
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: marketboardBackend
        run: |
          chmod +x gradlew
          ./gradlew test


  # =========================================================
  # 2. Collector Test
  # =========================================================
  collector:
    name: Collector (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: collector
        run: uv sync --locked --all-groups

      - name: Run tests
        working-directory: collector
        env:
          FINNHUB_API_KEY: test-key
        run: uv run pytest


  # =========================================================
  # 3. Frontend Test
  # =========================================================
  frontend:
    name: Frontend (typecheck / lint / build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: npm run build


  # =========================================================
  # 4. Backend Docker Image
  # GitHub-hosted runner에서 ARM64 이미지 생성
  # =========================================================
  backend-image:
    name: Build Backend Image
    needs: [backend, collector, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./marketboardBackend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/parkjunss/marketboard-backend:latest
            ghcr.io/parkjunss/marketboard-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


  # =========================================================
  # 5. Collector Docker Image
  # =========================================================
  collector-image:
    name: Build Collector Image
    needs: [backend, collector, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push collector
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/parkjunss/marketboard-collector:latest
            ghcr.io/parkjunss/marketboard-collector:${{ github.sha }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector


  # =========================================================
  # 6. Frontend Docker Image
  # =========================================================
  frontend-image:
    name: Build Frontend Image
    needs: [backend, collector, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/parkjunss/marketboard-frontend:latest
            ghcr.io/parkjunss/marketboard-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # =========================================================
  # 7. Raspberry Pi Deploy
  #
  # 중요:
  # Pi에서는 빌드하지 않는다.
  # GHCR pull + container 재생성만 수행한다.
  # =========================================================
  deploy:
    name: Deploy to Raspberry Pi

    needs:
      - backend-image
      - collector-image
      - frontend-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux, ARM64, deploy]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull application images
        run: |
          docker compose \
            --env-file /home/jun/marketboard/.env \
            pull backend collector frontend

      - name: Deploy
        run: |
          docker compose \
            --env-file /home/jun/marketboard/.env \
            up -d \
            --no-build \
            --remove-orphans

      - name: Show container status
        run: |
          docker compose \
            --env-file /home/jun/marketboard/.env \
            ps