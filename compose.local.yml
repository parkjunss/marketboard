name: marketboard-local

networks:
  marketboard-local:

volumes:
  local-mysql-data:
  local-redis-data:

services:
  mysql:
    image: mysql:8.4
    container_name: marketboard-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockmonitordb
      MYSQL_USER: stockmonitor
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-marketboard-local-root}
    volumes:
      - local-mysql-data:/var/lib/mysql
    ports:
      - "${LOCAL_MYSQL_PORT:-13308}:3306"
    networks: [marketboard-local]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: marketboard-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - local-redis-data:/data
    ports:
      - "${LOCAL_REDIS_PORT:-16380}:6379"
    networks: [marketboard-local]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: ./collector
    container_name: marketboard-local-collector
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: stockmonitordb
      MYSQL_USER: stockmonitor
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local}
      SP500_BATCH_PERIOD: ${SP500_BATCH_PERIOD:-2y}
      DAILY_BATCH_HOUR_UTC: ${DAILY_BATCH_HOUR_UTC:-6}
    ports:
      - "${LOCAL_COLLECTOR_PORT:-18001}:8000"
    networks: [marketboard-local]

  backend:
    build: ./marketboardBackend
    container_name: marketboard-local-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/stockmonitordb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: stockmonitor
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${LOCAL_JWT_SECRET:-local-development-secret-change-before-sharing}
      ADMIN_SEED_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@marketboard.local}
      ADMIN_SEED_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-ChangeMe1234!}
      CORS_ALLOWED_ORIGINS: http://localhost:${LOCAL_FRONTEND_PORT:-13100}
      COLLECTOR_BASE_URL: http://collector:8000
    ports:
      - "${LOCAL_BACKEND_PORT:-18081}:8080"
    networks: [marketboard-local]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${LOCAL_BACKEND_PORT:-18081}
        NEXT_PUBLIC_WS_URL: http://localhost:${LOCAL_BACKEND_PORT:-18081}/ws
    container_name: marketboard-local-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LOCAL_FRONTEND_PORT:-13100}:3100"
    networks: [marketboard-local]
