spring:
  application:
    name: marketboardBackend

  datasource:
    # rewriteBatchedStatements folds Hibernate's batched UPDATE/INSERT into fewer multi-row
    # statements -- without it, MySQL Connector/J still sends them one at a time regardless of
    # hibernate.jdbc.batch_size below.
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockmonitordb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:stockmonitor}
    password: ${DB_PASSWORD:stockmonitor1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Kept small on purpose: MySQL runs on the same Raspberry Pi as everything else in the
      # compose stack (this backend, the collector, frontend, Redis, Prometheus, Grafana, nginx,
      # ...), all sharing a handful of CPU cores -- more connections just means more contention
      # for MySQL's own threads, not more throughput. Requests beyond this queue on Hikari's own
      # wait queue (connection-timeout, left at Hikari's 30s default) instead of each opening a
      # new connection.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      pool-name: marketboard-hikari

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # Boot's defaults (200 max / 10 min-spare) assume a dedicated app server; on the Pi, each
      # idle thread's stack is memory taken away from MySQL/Redis/the other containers for no
      # benefit -- this app's real concurrency is nowhere near 200. Traffic beyond this queues
      # (server.tomcat.accept-count, left at its default of 100) rather than failing outright.
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-env}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@marketboard.local}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe1234!}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
    admin-capacity: ${RATE_LIMIT_ADMIN_CAPACITY:60}

collector:
  base-url: ${COLLECTOR_BASE_URL:http://localhost:8000}

indicators:
  cron: ${INDICATORS_CRON:0 */5 * * * *}

market-breadth:
  # Once a day is enough -- derived from daily bars, which only change once a day themselves.
  # 07:00 gives the daily backfill loops (which also run once a day, no fixed time) a head start,
  # though a stale/missing bar for a given symbol just gets skipped rather than miscounted.
  cron: ${MARKET_BREADTH_CRON:0 0 7 * * *}

sector-performance:
  # Matches the old Redis TTL this replaced -- frequent enough that the ranking doesn't feel
  # stale, infrequent enough that 11 sequential yfinance calls (one per sector ETF) stay well
  # clear of being a noticeable load source.
  cron: ${SECTOR_PERFORMANCE_CRON:0 */15 * * * *}
