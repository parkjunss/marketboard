spring:
  application:
    name: marketboardBackend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockmonitordb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:stockmonitor}
    password: ${DB_PASSWORD:stockmonitor1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-env}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@marketboard.local}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe1234!}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
    admin-capacity: ${RATE_LIMIT_ADMIN_CAPACITY:60}

collector:
  base-url: ${COLLECTOR_BASE_URL:http://localhost:8000}

indicators:
  cron: ${INDICATORS_CRON:0 */5 * * * *}
