server {
    listen 80;
    server_name marketboard.duckdns.org;

    # Required for certbot's webroot HTTP-01 challenge (both initial issuance and renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name marketboard.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/marketboard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketboard.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker's embedded DNS. Without this + the $upstream variable indirection below, nginx
    # resolves "backend"/"frontend" once at config-load time — if either isn't up yet right
    # then (e.g. nginx wins a race after a Pi reboot), nginx hard-fails to start instead of
    # just retrying on the next request.
    resolver 127.0.0.11 valid=30s;

    # REST API — controllers are already mounted at /api/... so no path rewrite.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over SockJS (WebSocketConfig.java registers the endpoint at /ws). SockJS
    # negotiates several sub-paths under /ws, and falls back to long-lived HTTP
    # streaming/polling transports if the WS upgrade fails — hence the long read timeout.
    location /ws {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream frontend:3100;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
