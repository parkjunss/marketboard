global:
  scrape_interval: 15s

scrape_configs:
  - job_name: marketboard-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal resolves to the Windows host from inside the Prometheus container
      # (Docker Desktop) — the backend runs directly on the host, not in a container.
      - targets: ['host.docker.internal:8080']
