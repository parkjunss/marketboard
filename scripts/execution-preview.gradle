// Test classpath only; never packaged in bootJar or exposed outside loopback.
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            tasks.register('executionPreview', JavaExec) {
                dependsOn testClasses
                classpath = sourceSets.test.runtimeClasspath
                mainClass = 'org.juns.marketboardbackend.execution.ExecutionPreview'
            }
        }
    }
}
